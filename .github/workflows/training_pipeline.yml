name: Training Pipeline - Daily Model Retraining

on:
  schedule:
    - cron: '0 2 * * *'  # runs daily at 2am UTC
  workflow_dispatch:      # allows manual trigger from GitHub UI

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install "hopsworks[python]" python-dotenv pandas scikit-learn joblib pyarrow confluent-kafka tensorflow

      - name: Run training pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_CERTS_PATH: /tmp
        run: python training_pipeline/train.py
